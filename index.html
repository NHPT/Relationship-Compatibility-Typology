<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RCT 关系适配类型学——通过场景选择识别关系兼容性，适用于婚恋、创业、伙伴、团队">
  <title>RCT 关系适配类型学</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- ============ 首页 ============ -->
    <section id="page-home" class="page active">
      <header class="hero">
        <div class="brand">
          <span class="logo">RCT</span>
          <div class="brand-text">
            <h1>关系适配类型学</h1>
            <p class="sub">Relationship Compatibility Typology</p>
          </div>
        </div>
        <p class="lead">不测性格，只测<b>关系</b>。通过 20 个日常场景的选择，识别你或对方在相处中的真实模式，判断两个人是否合适一起生活、一起做事、一起走远。</p>
      </header>

      <div class="mode-cards">
        <button id="btn-single" class="mode-card">
          <span class="mode-title">单人自测</span>
          <span class="mode-desc">测自己或某一个人的类型<br>约 3 分钟 · 20 题 · 每题限时 15 秒</span>
        </button>
        <button id="btn-pair" class="mode-card">
          <span class="mode-title">双人对比</span>
          <span class="mode-desc">分别测 A、B 两个人<br>再选场景，看两个人是否适配</span>
        </button>
        <button id="btn-history" class="mode-card">
          <span class="mode-title">历史记录</span>
          <span class="mode-desc">查看多次测试的稳定性<span id="history-count"></span></span>
        </button>
      </div>

      <div class="home-foot">
        <p class="muted">多次测试能提高准确性：每次题目随机生成、题面不同，测 2~3 次结果一致才可信。</p>
      </div>
    </section>

    <!-- ============ 答题页 ============ -->
    <section id="page-quiz" class="page">
      <div class="quiz-top">
        <div class="quiz-meta">
          <span id="quiz-sub">请凭直觉作答</span>
          <span id="quiz-progress">第 1 / 20 题</span>
        </div>
        <div class="quiz-timer" id="quiz-timer">15s</div>
      </div>
      <div class="progress-track"><div id="quiz-progress-bar" class="progress-bar"></div></div>

      <div class="quiz-body">
        <h2 class="quiz-text" id="quiz-text"></h2>
        <div class="options" id="quiz-options"></div>
      </div>
    </section>

    <!-- ============ 单人结果页 ============ -->
    <section id="page-result" class="page">
      <div class="result-card">
        <div class="result-head">
          <div>
            <div class="result-code" id="result-code">A</div>
            <h2 id="result-type">安稳共栖型</h2>
            <p class="result-axes" id="result-axes"></p>
          </div>
        </div>

        <div id="result-warn" class="warn-banner hidden"></div>

        <div class="result-grid">
          <div class="kv"><span class="k">核心特征</span><span id="result-core"></span></div>
          <div class="kv"><span class="k">典型标签</span><span id="result-tags"></span></div>
          <div class="kv"><span class="k">优势</span><span id="result-strength"></span></div>
          <div class="kv"><span class="k">风险</span><span id="result-risk"></span></div>
        </div>

        <h3 class="sec-title">维度倾向</h3>
        <div id="result-dims" class="dims"></div>

        <div id="result-stability" class="stability hidden"></div>

        <div class="actions">
          <button id="btn-again" class="btn">再测一次</button>
          <button id="btn-to-pair" class="btn btn-ghost">去双人对比</button>
          <button class="btn btn-ghost" onclick="show('home')">返回首页</button>
        </div>
      </div>
    </section>

    <!-- ============ 双人对比页 ============ -->
    <section id="page-pair" class="page">
      <div class="result-card">
        <h2 class="sec-title">双人适配报告</h2>

        <div class="pair-head">
          <div class="pair-person">
            <span class="pair-label">A 方</span>
            <span class="pair-type" id="pair-a-type"></span>
            <span class="pair-axes" id="pair-a-axes"></span>
          </div>
          <div class="pair-person">
            <span class="pair-label">B 方</span>
            <span class="pair-type" id="pair-b-type"></span>
            <span class="pair-axes" id="pair-b-axes"></span>
          </div>
        </div>

        <h3 class="sec-title">选择关系场景</h3>
        <div id="pair-scenes" class="scenes"></div>

        <h3 class="sec-title">适配结论</h3>
        <div id="pair-conclusion" class="pair-conclusion"></div>

        <h3 class="sec-title">关键标签对比</h3>
        <div id="pair-labels" class="pair-labels"></div>

        <div class="actions">
          <button id="btn-pair-restart" class="btn">重新对比</button>
          <button class="btn btn-ghost" onclick="show('home')">返回首页</button>
        </div>
      </div>
    </section>

    <!-- ============ 历史页 ============ -->
    <section id="page-history" class="page">
      <div class="result-card">
        <h2 class="sec-title">历史记录与稳定性</h2>
        <div id="history-list"></div>
        <div class="actions">
          <button class="btn" onclick="show('home')">返回首页</button>
        </div>
      </div>
    </section>

  </div>

  <script src="js/questionBank.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
